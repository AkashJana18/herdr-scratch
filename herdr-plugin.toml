id = "herdr.scratch"
name = "Scratch"
version = "1.1.0"
min_herdr_version = "0.7.4"
description = "Persistent named scratchpads for Herdr"
platforms = ["linux", "macos"]

[[build]]
command = ["/bin/sh", "-c", "exec \"${HERDR_PLUGIN_ROOT:-.}/scripts/install-binary.sh\""]

[[actions]]
id = "guide"
title = "Scratch quick start"
description = "Open a visible guide to toggling, hiding, and configuring Scratch."
contexts = ["global", "workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" guide"]

[[actions]]
id = "toggle"
title = "Toggle scratchpad"
description = "Show the default scratchpad, or return to the previous Herdr context when it is active."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" toggle"]

[[actions]]
id = "open"
title = "Open scratchpad"
description = "Create or show the default scratchpad."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" open"]

[[actions]]
id = "list"
title = "List scratchpads"
description = "List known scratchpads."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" list"]

[[actions]]
id = "doctor"
title = "Check scratch setup"
description = "Validate Herdr Scratch configuration and runtime connectivity."
contexts = ["global", "workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" doctor"]

[[actions]]
id = "lazygit"
title = "Toggle lazygit"
description = "Open or focus a lazygit scratchpad in the current Herdr context."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" toggle lazygit -- lazygit"]

[[actions]]
id = "notes"
title = "Toggle notes"
description = "Open or focus a notes scratchpad."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" toggle notes"]

[[actions]]
id = "daily"
title = "Open daily note"
description = "Open today's daily note in your Obsidian vault (auto-detected) or a local fallback file."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" daily"]

[[actions]]
id = "size-up"
title = "Increase popup size (deprecated)"
description = "The overlay viewer no longer supports sizing; this action is a no-op."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" resize up"]

[[actions]]
id = "size-down"
title = "Decrease popup size (deprecated)"
description = "The overlay viewer no longer supports sizing; this action is a no-op."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" resize down"]

[[actions]]
id = "fullscreen"
title = "Toggle popup fullscreen (deprecated)"
description = "The overlay viewer no longer supports sizing; this action is a no-op."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" fullscreen"]

[[actions]]
id = "reset"
title = "Reset popup size (deprecated)"
description = "The overlay viewer no longer supports sizing; this action is a no-op."
contexts = ["workspace", "tab", "pane"]
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" reset"]

[[panes]]
id = "guide"
title = "Scratch quick start"
description = "Interactive first-run guide for Scratch."
placement = "popup"
width = "70%"
height = "60%"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" guide-pane"]

[[panes]]
id = "scratch"
title = "Scratch"
description = "Persistent backing scratchpad runtime."
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" session"]

[[panes]]
id = "viewer"
title = "Scratch"
description = "Overlay viewer for the scratchpad runtime. All Herdr keys stay active; toggle with the Scratch keybinding."
placement = "overlay"
command = ["/bin/sh", "-c", "exec \"$HERDR_PLUGIN_ROOT/bin/herdr-scratch\" attach"]
